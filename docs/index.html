const SUPPORTED = ['it', 'en', 'de', 'fr', 'es'];

function detectLang() {
  const saved = localStorage.getItem('camperapp_lang');
  if (saved && SUPPORTED.includes(saved)) return saved;
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return SUPPORTED.includes(nav) ? nav : 'en';
}

function applyLang(lang) {
  document.documentElement.lang = lang;
  const dict = I18N[lang] || I18N.en;
  // page title
  if (dict.page_title) document.title = dict.page_title;
  // meta description
  const desc = document.querySelector('meta[name="description"]');
  if (desc && dict.page_desc) desc.setAttribute('content', dict.page_desc);
  // all data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (dict[k] != null) el.textContent = dict[k];
  });
  // active button state
  document.querySelectorAll('.lang-switcher button').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-set-lang') === lang);
  });
  localStorage.setItem('camperapp_lang', lang);
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.lang-switcher button').forEach(b => {
    b.addEventListener('click', () => applyLang(b.getAttribute('data-set-lang')));
  });
  applyLang(detectLang());
});
</script>
