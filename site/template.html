.lang-switcher a.active { background: var(--blu); }

/* Sections */
section { padding: 80px 0; }

.section-sub { text-align: center; font-size: 18px; color: var(--testo-soft); max-width: 700px; margin: 0 auto 56px; }

/* Features */
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
.feature { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; transition: transform 0.15s, box-shadow 0.15s; }

.feature h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }

/* Privacy */
.privacy { background: var(--card); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.privacy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 32px; text-align: center; }
.privacy-item .icon { font-size: 40px; }
.privacy-item h4 { font-size: 18px; font-weight: 700; margin: 12px 0 6px; }
.privacy-item p { color: var(--testo-soft); font-size: 14px; }

/* Install */

.install-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }

.note { background: #fff8db; border-left: 4px solid var(--giallo); padding: 16px 20px; border-radius: 8px; margin-top: 20px; font-size: 14px; color: var(--testo); }

/* Sponsor */
